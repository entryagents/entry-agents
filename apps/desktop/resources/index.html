<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e0f" />
    <title>Entry Agents</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0e0e0f;
        overflow: hidden;
      }
      #root {
        height: 100vh;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*! Entry UI 1.0.0: three-column agent workspace (sidebar / chat / artifact panel)
       *  Zero dependencies. Renders inside a shadow root, so host-app CSS can't change it
       *  and it can't leak styles into the host.
       *
       *    <div id="root" style="height:100vh"></div>
       *    (load this file with a script tag, then:)
       *    const ui = EntryUI.mount(document.getElementById('root'), {
       *      conversations: [...], onSend: async ({ text, reply, signal }) => { ... }
       *    });
       *
       *  Also works as a module:  import EntryUI from './entry-ui.js'
       *  See README.md for Electron, Tauri, React/Next.js recipes and the full API.
       */
      (function (root, factory) {
        if (typeof module === "object" && module.exports)
          module.exports = factory();
        else root.EntryUI = factory();
      })(typeof self !== "undefined" ? self : this, function () {
        "use strict";

        var CSS = `/* =========================================================
   THEME TOKENS: everything visual hangs off these variables
   ========================================================= */
:host{
  display:block;height:100%;min-height:0;
  color-scheme:dark;

  --bg-0:#0e0e0f;            /* title bar + sidebar */
  --bg-1:#131314;            /* chat + artifact canvas */
  --bg-2:#1a1a1c;            /* cards, composer, hover */
  --bg-3:#252528;            /* active rows, pressed */
  --bg-4:#2f2f34;

  --line:#222225;
  --line-2:#2e2e32;

  --fg:#ececee;
  --fg-2:#cdcdd1;
  --fg-3:#9a9aa0;
  --fg-4:#707077;

  --accent:#1d8bff;
  --accent-hi:#4aa3ff;
  --code:#d7ba7d;
  --code-bg:#1f1f22;
  --danger:#ff7b72;

  --titlebar-h:38px;
  --titlebar-pad-left:19px;            /* raise to ~78px to clear macOS traffic lights */
  --head-h:40px;
  --sb-w:clamp(244px,21vw,360px);     /* sidebar width  (drag to resize) */
  --ar-w:clamp(380px,35vw,760px);     /* artifact width (drag to resize) */
  --card-max:132px;                   /* max height of the pinned prompt card */

  --font:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul,ol,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid rgba(74,163,255,.75);outline-offset:-2px}
::selection{background:rgba(29,139,255,.35)}

*{scrollbar-width:thin;scrollbar-color:#34343a transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#303035;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#45454c;background-clip:padding-box}

.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{position:relative;display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;background:var(--bg-0);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
.workbench{flex:1;min-height:0;display:flex;position:relative}

/* ---------- title bar ---------- */
.titlebar{height:var(--titlebar-h);flex:none;display:flex;align-items:center;justify-content:space-between;padding-left:var(--titlebar-pad-left);user-select:none;-webkit-user-select:none;-webkit-app-region:drag}
.menubar{display:flex;align-items:center;gap:3px}
.titlebar-logo{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;overflow:hidden;margin-right:6px;flex:none}
.titlebar-logo .ico{width:18px;height:18px;stroke:none}
.brand{font-weight:600;color:var(--fg);font-size:13px}
.titlebar-beta{font-size:10px;padding:1px 6px;margin-left:4px;margin-right:12px;border-radius:4px;background:rgba(29,139,255,.14);color:var(--accent-hi);border:1px solid rgba(29,139,255,.28);font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.menubar button{height:26px;padding:0 10px;border-radius:6px;color:var(--fg-3);transition:background .12s,color .12s;-webkit-app-region:no-drag}
.menubar button:hover,.menubar button[aria-expanded="true"]{background:var(--bg-3);color:var(--fg)}
.winctl{display:flex;height:100%}
.winctl button{width:47px;height:100%;display:grid;place-items:center;border-radius:0;color:var(--fg-3);transition:background .12s,color .12s;-webkit-app-region:no-drag}
.winctl button:hover{background:var(--bg-3);color:var(--fg)}
.winctl .close:hover{background:#c42b1c;color:#fff}
.winctl button:focus-visible{outline-offset:-3px}
.app[data-maximized="true"] .wc.sq,.app:not([data-maximized="true"]) .wc.rs{display:none}
.app[data-titlebar="none"] .titlebar{display:none}
.app[data-titlebar="menubar"] .winctl{display:none}
.wc{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1}

/* ---------- shared bits ---------- */
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border-radius:6px;color:var(--fg-3);transition:background .12s,color .12s}
.icon-btn:hover{background:var(--bg-3);color:var(--fg)}
.icon-btn:disabled{opacity:.35;pointer-events:none}
.icon-btn[aria-pressed="true"]{color:var(--fg)}
.icon-btn.sm{width:24px;height:24px}

.resizer{flex:none;width:1px;background:var(--line);position:relative;cursor:col-resize;z-index:20;transition:background .15s}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}
.resizer:hover,.resizer:focus-visible,.resizer.is-dragging{background:var(--accent)}
.app.is-resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}

.app[data-sidebar="closed"] .sidebar,
.app[data-sidebar="closed"] .rz-sb{display:none}
.app[data-artifact="closed"] .artifact,
.app[data-artifact="closed"] .rz-ar{display:none}
.app[data-expanded="true"] .chat,
.app[data-expanded="true"] .rz-ar{display:none}
.app[data-expanded="true"] .artifact{flex:1;width:auto}

/* =========================================================
   COLUMN 1: SIDEBAR
   ========================================================= */
.sidebar{width:var(--sb-w);flex:none;min-height:0;display:flex;flex-direction:column;background:var(--bg-0)}
.sb-top{height:var(--head-h);flex:none;display:flex;align-items:center;gap:5px;padding:0 10px 0 15px}
.logo{display:grid;place-items:center;width:28px;height:28px;margin-right:6px;border-radius:6px;overflow:hidden;flex:none}
.logo .ico{width:26px;height:26px;stroke:none}
.sb-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 8px}

.search{display:flex;align-items:center;gap:8px;height:32px;margin-top:8px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg-1);color:var(--fg-3)}
.search[hidden]{display:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font-size:13.5px}
.search input::placeholder{color:var(--fg-4)}

.new-chat{display:flex;align-items:center;gap:8px;height:33px;margin:14px 0 8px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;color:var(--fg);text-align:left;transition:background .12s}
.search + .new-chat{margin-top:8px}
.new-chat:hover{background:var(--bg-2)}

.nav{display:flex;flex-direction:column;gap:5px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:7px;color:var(--fg-2);text-align:left;white-space:nowrap;transition:background .12s,color .12s}
.nav-item .ico{color:var(--fg-3)}
.nav-item:hover{background:var(--bg-2);color:var(--fg)}
.nav-badge{margin-left:auto;padding:1px 6px;border-radius:10px;background:#1d8bff22;color:#1d8bff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.ico-ext{margin-left:auto;width:12px;height:12px;opacity:0.6}
.nav-billing:hover .ico-ext{opacity:1;color:var(--accent)}

.sec-head{display:flex;align-items:center;justify-content:space-between;height:30px;margin-top:12px;padding:0 4px 0 10px;color:var(--fg-4);font-size:12.5px;font-weight:600}
.sec-head.first{margin-top:22px}
.sec-actions{display:flex;gap:2px}

.conv-list{
  flex:1;min-height:0;overflow-y:auto;margin:4px -8px 0;padding:0 8px 44px;
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 52px),transparent);
          mask-image:linear-gradient(to bottom,#000 calc(100% - 52px),transparent);
}
.conv-list::-webkit-scrollbar{display:none}
.conv{display:flex;align-items:center;gap:8px;width:100%;height:32px;margin:1.2px 0;padding:0 9px 0 10px;border-radius:7px;color:var(--fg-2);text-align:left;transition:background .12s}
.conv:hover{background:var(--bg-2)}
.conv.is-active{background:var(--bg-3);color:var(--fg)}
.conv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .m{flex:none;font-size:12.5px;color:var(--fg-4)}
.conv.is-active .m{color:var(--fg-3)}
.dot{flex:none;width:7px;height:7px;margin-right:2px;border-radius:50%;background:var(--accent)}
.empty-note{padding:12px 10px;color:var(--fg-4);font-size:13px}
.sb-foot{flex:none;padding:6px 8px 10px}

/* =========================================================
   COLUMN 2: CHAT
   ========================================================= */
.chat{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg-1)}
.chat-head{height:var(--head-h);flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px}
.btn-sb-open{display:none}
.app[data-sidebar="closed"] .btn-sb-open{display:inline-grid}
.app[data-sidebar="closed"] .chat-head{padding-left:10px}
.chat-title{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:28px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-edit{width:100%;height:28px;margin-left:-8px;padding:0 8px;border:1px solid var(--accent);border-radius:6px;outline:0;background:var(--bg-0);color:var(--fg);font-size:14.5px;font-weight:500}

.transcript-wrap{flex:1;min-height:0;position:relative}
.transcript-wrap::after{content:"";position:absolute;z-index:7;left:0;right:0;bottom:0;height:40px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg-1))}
.transcript{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;padding:0 16px 28px;overscroll-behavior:contain}

/* the user's prompt pins to the top while its answer scrolls underneath */
.turn-head{position:sticky;top:0;z-index:6;padding:16px 0 22px;background:linear-gradient(to bottom,var(--bg-1) calc(100% - 24px),transparent)}
.user-card{max-height:var(--card-max);overflow:auto;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);color:var(--fg);font-size:14px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{padding:4px 10px 18px}

.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--fg-4);animation:blink 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-2px)}}

.jump{position:absolute;z-index:8;left:50%;bottom:18px;width:30px;height:30px;margin-left:-15px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%;background:var(--bg-2);color:var(--fg-2);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .15s,transform .15s,background .12s}
.jump.is-visible{opacity:1;transform:none;pointer-events:auto}
.jump:hover{background:var(--bg-3);color:var(--fg)}

/* empty state */
.empty{min-height:100%;display:grid;align-content:center;justify-items:center;gap:10px;padding:32px 8px;text-align:center}
.empty .mark{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);color:#f2f2f4}
.empty .mark .ico{width:24px;height:24px;stroke-width:2.1}
.empty h2{font-size:20px;line-height:28px;font-weight:600;color:var(--fg)}
.empty p{max-width:340px;color:var(--fg-3);line-height:22px}
.suggest{display:flex;flex-direction:column;gap:8px;width:min(420px,100%);margin-top:10px}
.suggest button{padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);color:var(--fg-2);text-align:left;font-size:13.5px;transition:background .12s,color .12s}
.suggest button:hover{background:var(--bg-3);color:var(--fg)}

/* composer */
.composer-wrap{flex:none;padding:0 18px 10px 16px}
.composer{display:flex;flex-direction:column;gap:6px;padding:12px 12px 8px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);transition:border-color .15s}
.composer:focus-within{border-color:#43434a}
.composer textarea{display:block;width:100%;min-height:24px;max-height:200px;padding:0;border:0;outline:0;resize:none;background:none;color:var(--fg);font-size:15px;line-height:24px}
.composer textarea::placeholder{color:var(--fg-4)}
.c-row{display:flex;align-items:center;gap:4px;margin-left:-6px}
.c-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 8px;border-radius:6px;color:var(--fg-3);font-size:13px;white-space:nowrap;transition:background .12s,color .12s}
.chip:hover,.chip[aria-expanded="true"]{background:var(--bg-3);color:var(--fg)}
.chip .lbl{overflow:hidden;text-overflow:ellipsis}
#btnMode{flex:none}
.chip .ico{width:14px;height:14px}
.chip .ico.chev{width:12px;height:12px}
.send{display:grid;place-items:center;width:28px;height:28px;margin-left:4px;flex:none;border-radius:50%;background:var(--accent);color:#fff;transition:background .12s}
.send:hover{background:var(--accent-hi)}
.send:disabled{background:var(--bg-4);color:var(--fg-4);cursor:default}

/* =========================================================
   RICH TEXT (chat answers + artifact documents)
   ========================================================= */
.md{color:var(--fg-2);font-size:14.5px;line-height:24px;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md p{margin:0 0 12px}
.md h1{margin:6px 0 14px;font-size:22px;line-height:34px;font-weight:500;color:var(--fg)}
.md h2{margin:28px 0 10px;font-size:17.5px;line-height:26px;font-weight:600;color:var(--fg)}
.md h3{margin:20px 0 8px;font-size:15.5px;line-height:24px;font-weight:600;color:var(--fg)}
.md strong{font-weight:600;color:var(--fg)}
.md ul,.md ol{margin:6px 0 12px;padding-left:19px}
.md ol{padding-left:56px}
.md li{margin:0}
.md ol>li{margin:8px 0}
.md li>ul,.md li>ol{margin:8px 0 4px;padding-left:40px}
.md li::marker{color:var(--fg-3)}
.md code{padding:3px 6px;border-radius:5px;background:var(--code-bg);color:var(--code);font:12.5px/1 var(--mono);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.md h2 code{padding:3px 7px;font-size:14px}
.md hr{margin:28px 0;border:0;border-top:1px solid var(--line-2)}

.art-card{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;margin:18px 0 6px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);text-align:left;transition:background .12s,border-color .12s}
.art-card:hover{background:var(--bg-3);border-color:var(--bg-4)}
.art-card .ac-ico{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:8px;background:var(--bg-3);color:var(--fg-3)}
.art-card .ac-t{display:block;font-weight:500;line-height:20px;color:var(--fg)}
.art-card .ac-s{display:block;font-size:12.5px;line-height:18px;color:var(--fg-4)}

/* =========================================================
   COLUMN 3: ARTIFACT PANEL
   ========================================================= */
.artifact{width:var(--ar-w);flex:none;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg-1)}
.art-tabs{height:var(--head-h);flex:none;display:flex;align-items:center;gap:2px;padding:0 10px 0 8px}
.btn-art-back{display:none}
.tabs{position:relative;flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.fade-l{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px);mask-image:linear-gradient(to right,transparent 0,#000 24px)}
.tabs.fade-r{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 24px);mask-image:linear-gradient(to left,transparent 0,#000 24px)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%)}
.tab{display:inline-flex;align-items:center;gap:7px;flex:none;height:28px;max-width:340px;padding:0 5px 0 9px;border-radius:6px;color:var(--fg-3);white-space:nowrap;cursor:pointer;transition:background .12s,color .12s}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--bg-2);color:var(--fg)}
.tab.is-active{background:var(--bg-3);color:var(--fg)}
.tab .x{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;color:var(--fg-3);opacity:0;transition:opacity .12s,background .12s}
.tab .x .ico{width:12px;height:12px}
.tab:hover .x,.tab.is-active .x,.tab:focus-within .x{opacity:1}
.tab .x:hover{background:var(--bg-4);color:var(--fg)}
.sp{flex:1}

.art-sub{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;font-weight:500;color:var(--fg-2)}
.art-actions{display:flex;gap:6px}
.art-body{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:10px 20px 56px 12px}
.art-empty{height:100%;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;color:var(--fg-3)}
.art-empty button{padding:8px 14px;border:1px solid var(--line-2);border-radius:8px;color:var(--fg-2);transition:background .12s}
.art-empty button:hover{background:var(--bg-2)}

.doc{outline:0}
.doc h1{margin:8px 0 14px}
.doc h2{margin:34px 0 14px;font-size:19px;line-height:28px}
.doc p{margin:0 0 14px}
.doc ul.todo{list-style:none;padding-left:2px}
.doc ul.todo li{margin:6px 0}
.doc ul.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.doc ul.todo input{flex:none;margin:5px 0 0;accent-color:var(--accent)}
.doc table{display:block;max-width:100%;margin:12px 0 18px;overflow-x:auto;border-collapse:collapse;font-size:13px;line-height:20px}
.doc th,.doc td{padding:8px 14px 8px 0;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.doc th{font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--fg-3)}
.doc pre{margin:12px 0 18px;padding:12px 14px;overflow:auto;border:1px solid var(--line-2);border-radius:8px;background:#101011;color:var(--fg-2);font:12.5px/1.65 var(--mono)}
.doc pre code{padding:0;background:none;color:inherit;font:inherit}

/* architecture diagram */
.fig{margin:14px 0 22px;padding:8px;border:1px solid var(--line-2);border-radius:8px;background:#121213;cursor:zoom-in}
.fig figcaption{margin-top:6px;text-align:right;font-size:11.5px;color:var(--fg-4)}
.dg{width:100%;height:auto;font-family:var(--font)}
.dg-g{fill:none;stroke:#5a5a61;stroke-width:.9}
.dg-b{fill:#1b1b1d;stroke:#47474d;stroke-width:.8}
.dg-gt{fill:#d6d6da;font-size:8.5px;font-weight:600}
.dg-bt{fill:#e8e8ea;font-size:8px;font-weight:500;text-anchor:middle}
.dg-bs{fill:#8e8e95;font-size:6.8px;text-anchor:middle}
.dg-ln{fill:none;stroke:#7b7b82;stroke-width:.9}
.dg-ah{fill:#8a8a91}
.dg-lb{fill:#8e8e95;font-size:7px}

/* =========================================================
   OVERLAYS
   ========================================================= */
.pop{position:absolute;z-index:90;min-width:200px;max-width:min(340px,calc(100% - 16px));max-height:min(440px,calc(100% - 16px));overflow-y:auto;padding:5px;border:1px solid var(--line-2);border-radius:10px;background:#1b1b1e;box-shadow:0 14px 36px rgba(0,0,0,.55)}

.pop .stack{display:flex;flex-direction:column;flex:1;min-width:0}
.pop .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pop .kbd{margin-left:auto;padding-left:18px;font-size:12px;color:var(--fg-4)}

.toast{position:absolute;z-index:120;left:50%;bottom:28px;padding:8px 14px;border:1px solid var(--line-2);border-radius:999px;background:#232326;color:var(--fg);font-size:13px;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.lightbox{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.lightbox .box{width:min(1100px,100%);max-height:100%;overflow:auto;padding:14px;border:1px solid var(--line-2);border-radius:10px;background:#141415}
.lightbox .dg{min-width:720px}

.scrim{display:none;position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.app[data-sidebar="open"] .scrim{opacity:1;pointer-events:auto}

/* =========================================================
   RESPONSIVE: driven by the width of the element the UI is mounted in
   (not the window), so it also behaves in split panes and embedded views
   lt1100: sidebar becomes a slide-over drawer
   lt860 : artifact panel becomes a full-size sheet
   lt560 : tighter phone spacing
   ========================================================= */
.app[data-lt1100] .sidebar,
.app[data-lt1100][data-sidebar="closed"] .sidebar{
  display:flex;position:absolute;z-index:40;left:0;top:0;bottom:0;width:min(340px,88%);
  border-right:1px solid var(--line);
  transform:translateX(-102%);visibility:hidden;
  transition:transform .22s ease,visibility 0s linear .22s;
}
.app[data-lt1100][data-sidebar="open"] .sidebar{transform:none;visibility:visible;transition-delay:0s;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.app[data-lt1100] .rz-sb{display:none!important}
.app[data-lt1100] .scrim{display:block}

.app[data-lt860] .artifact,
.app[data-lt860][data-artifact="closed"] .artifact{
  display:flex;position:absolute;z-index:45;inset:0;width:auto;
  transform:translateX(102%);visibility:hidden;
  transition:transform .22s ease,visibility 0s linear .22s;
}
.app[data-lt860][data-artifact="open"] .artifact{transform:none;visibility:visible;transition-delay:0s}
.app[data-lt860] .rz-ar{display:none!important}
.app[data-lt860] .btn-expand{display:none}
.app[data-lt860] .btn-art-back{display:inline-grid}

.app[data-lt560]{--card-max:96px}
.app[data-lt560] .transcript{padding:0 12px 24px}
.app[data-lt560] .assistant{padding:4px 4px 16px}
.app[data-lt560] .composer-wrap{padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.app[data-lt560] .composer textarea{max-height:160px;font-size:16px}
.app[data-lt560] .md{font-size:15px}
.app[data-lt560] .md ol{padding-left:38px}
.app[data-lt560] .md li>ul,.app[data-lt560] .md li>ol{padding-left:26px}
.app[data-lt560] .art-body{padding:10px 16px 48px}
.app[data-lt560] .doc h1{font-size:20px;line-height:30px}
.app[data-lt560] .toast{bottom:84px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.set-select:focus,.set-input:focus{border-color:var(--accent)}
.set-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:600;transition:all .12s;cursor:pointer}
.set-btn.primary{background:var(--accent);color:#fff}
.set-btn.primary:hover{background:var(--accent-hi)}
.set-btn.secondary{background:var(--bg-0);border:1px solid var(--line-2);color:var(--fg-2)}
.set-btn.secondary:hover{background:var(--bg-3);color:var(--fg)}
.set-btn.danger{background:transparent;border:1px solid rgba(255,123,114,.3);color:var(--danger)}
.set-btn.danger:hover{background:rgba(255,123,114,.12)}

/* =========================================================
   OPENCODE PERMISSION DOCK (1:1 PARITY)
   ========================================================= */
.perm-dock{border:1px solid #f59e0b44;border-radius:12px;background:linear-gradient(180deg,#f59e0b12 0%,#1a1a1cf0 40px);padding:14px 16px;margin:12px 0;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.perm-dock.is-resolved{border-color:var(--line);background:var(--bg-2);box-shadow:none}
.perm-dock-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.perm-badge-title{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#fbbf24}
.perm-badge-title .ico{width:16px;height:16px}
.perm-tool-badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b44;font-weight:600}
.perm-dock-desc{font-size:12.5px;color:var(--fg-2);line-height:1.45}
.perm-code-box{font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:8px;background:var(--bg-0);border:1px solid var(--line-2);color:var(--fg);overflow-x:auto;white-space:pre-wrap;max-height:160px}
.perm-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--fg-4);flex-wrap:wrap;gap:6px}
.perm-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.perm-btn{height:30px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:600;transition:all .12s;cursor:pointer}
.perm-btn.deny{background:transparent;border:1px solid var(--line-2);color:var(--danger)}
.perm-btn.deny:hover{background:rgba(255,123,114,.12);border-color:var(--danger)}
.perm-btn.always{background:var(--bg-0);border:1px solid var(--line-2);color:var(--fg-2)}
.perm-btn.always:hover{background:var(--bg-3);color:var(--fg)}
.perm-btn.once{background:var(--accent);border:none;color:#fff}
.perm-btn.once:hover{background:var(--accent-hi)}

.perm-feedback-wrap{display:flex;gap:6px;width:100%;margin-top:6px}
.perm-feedback-input{flex:1;height:30px;padding:0 10px;border-radius:6px;background:var(--bg-0);border:1px solid var(--line-2);color:var(--fg);font-size:12px;outline:0}
.perm-feedback-input:focus{border-color:var(--accent)}
.perm-feedback-btn{height:30px;padding:0 12px;border-radius:6px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg);font-size:11.5px;font-weight:600;cursor:pointer}
.perm-feedback-btn:hover{background:var(--bg-4)}

/* Popover floating menus (Composer Model Picker & Mode Switcher) */
.popover-menu{position:absolute;bottom:calc(100% + 8px);z-index:85;border-radius:10px;background:var(--bg-1);border:1px solid var(--line-2);box-shadow:0 12px 36px rgba(0,0,0,.6);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:300px;animation:settingsModal .14s ease-out}
.popover-menu[hidden]{display:none}
.popover-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;font-size:12.5px;color:var(--fg-2);transition:all .12s;cursor:pointer}
.popover-item:hover{background:var(--bg-3);color:var(--fg)}
.popover-item.is-active{background:var(--bg-2);color:var(--fg);font-weight:600}
.popover-item-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--fg-4);padding:6px 10px 2px}
.popover-divider{height:1px;background:var(--line);margin:4px 0}
.popover-live-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:11px;color:var(--fg-3)}
.popover-live-badge{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.popover-live-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;animation:pulseLive 2s infinite}
@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.4}}
.popover-refresh-btn{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;color:var(--fg-3);font-size:13px;transition:all .12s;cursor:pointer}
.popover-refresh-btn:hover{background:var(--bg-3);color:var(--fg)}
.popover-refresh-btn.is-spinning{animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* User Profile button in sidebar footer */
.user-profile-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);width:100%;text-align:left;cursor:pointer;transition:all .12s;margin-bottom:6px}
.user-profile-btn:hover{background:var(--bg-3);border-color:var(--line-2)}
.user-avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 0%,#8b5cf6 100%);color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.user-info{display:flex;flex-direction:column;min-width:0;flex:1}
.user-name{font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-plan{font-size:10.5px;color:var(--fg-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0}
.sb-foot-row{display:flex;align-items:center;gap:4px;width:100%}
.sb-foot-row .nav-item{flex:1}

/* OpenCode Clean Toggle Switch */
.toggle-switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:rgba(255,255,255,.12);transition:.15s;border-radius:20px;border:1px solid var(--line-2)}
.toggle-slider:before{position:absolute;content:"";height:14px;width:14px;left:2px;bottom:2px;background-color:#fff;transition:.15s;border-radius:50%}
.toggle-switch input:checked + .toggle-slider{background-color:var(--accent);border-color:var(--accent)}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(16px)}

/* Segmented button control (OpenCode style) */
.segmented-control{display:inline-flex;align-items:center;background:var(--bg-0);border:1px solid var(--line-2);border-radius:6px;padding:2px;gap:2px}
.segmented-btn{height:26px;padding:0 10px;border-radius:4px;font-size:11.5px;font-weight:500;color:var(--fg-3);background:transparent;border:0;cursor:pointer;transition:all .12s}
.segmented-btn:hover{color:var(--fg)}
.segmented-btn.is-active{background:var(--bg-3);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* Modal Overlay & Auth Dialog */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:95;display:grid;place-items:center;padding:20px;animation:settingsFade .12s ease-out}
.modal-overlay[hidden]{display:none}
.auth-dialog{width:100%;max-width:440px;background:var(--bg-1);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;animation:settingsModal .15s cubic-bezier(.16,1,.3,1)}
.auth-dialog-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.auth-dialog-brand{display:flex;align-items:center;gap:10px}
.auth-dialog-brand .ico{width:22px;height:22px}
.auth-dialog-title{font-size:15px;font-weight:700;color:var(--fg)}
.auth-dialog-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.auth-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;width:100%;border-radius:8px;background:#fff;color:#000;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.auth-oauth-btn:hover{background:#f0f0f0}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--fg-4);font-size:11px;text-transform:uppercase;letter-spacing:0.05em}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form-lbl{font-size:12px;font-weight:600;color:var(--fg-2)}
.auth-input{height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-0);color:var(--fg);font-family:var(--mono);font-size:12px;outline:0}
.auth-input:focus{border-color:var(--accent)}
.auth-submit-btn{height:36px;width:100%;border-radius:6px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s}
.auth-submit-btn:hover{background:var(--accent-hi)}

/* Model Picker Popover search */
.popover-search-wrap{padding:6px 6px 2px}
.popover-search{width:100%;height:28px;padding:0 8px;border-radius:5px;background:var(--bg-0);border:1px solid var(--line-2);color:var(--fg);font-size:11.5px;outline:0}
.popover-search:focus{border-color:var(--accent)}

                conv.initialScrollTop = null;

          var permissionState = {
            mode: "turbo", // 'turbo' | 'balanced' | 'review'
            autoApprove: true, // OpenCode autoApprove parity
            sandboxRoot: "/home/antigravity/entryagents/entry-agents",
            containmentStrict: true,
            blockSensitivePaths: true,
            savedRules: [
              {
                id: "rule-1",
                action: "read:*",
                resource: "*",
                effect: "allow",
                desc: "Read workspace files",
              },
              {
                id: "rule-2",
                action: "edit:*",
                resource: "src/**",
                effect: "allow",
                desc: "Edit project source",
              },
              {
                id: "rule-3",
                action: "bash:*",
                resource: "npm test*",
                effect: "allow",
                desc: "Run test suite",
              },
              {
                id: "rule-4",
                action: "bash:*",
                resource: "git status*",
                effect: "allow",
                desc: "Git status query",
              },
              {
                id: "rule-5",
                action: "bash:rm -rf /",
                resource: "*",
                effect: "deny",
                desc: "Destructive root wipe",
              },
              {
                id: "rule-6",
                action: "read:.env*",
                resource: "*",
                effect: "deny",
                desc: "Protect credential files",
              },
            ],
          };

          function matchWildcard(str, pattern) {
            if (!pattern || pattern === "*") return true;
            if (!str) return false;
            var regexStr =
              "^" +
              pattern
                .replace(/[-/\\^$+?.()|[\]{}]/g, "\\$&")
                .replace(/\*/g, ".*") +
              "$";
            return new RegExp(regexStr, "i").test(str);
          }

          function evaluatePermission(toolCall) {
            var tool = toolCall.tool || "bash";
            var command = toolCall.command || toolCall.input || "";
            var resource =
              toolCall.resource || toolCall.path || permissionState.sandboxRoot;

            // 1. Hard deny rules always take precedence
            for (var i = 0; i < permissionState.savedRules.length; i++) {
              var r = permissionState.savedRules[i];
              if (r.effect === "deny") {
                if (
                  matchWildcard(tool, r.action) &&
                  (matchWildcard(resource, r.resource) ||
                    matchWildcard(command, r.resource))
                ) {
                  return {
                    effect: "deny",
                    reason: r.desc || "Operation blocked by security policy",
                  };
                }
              }
            }

            if (permissionState.blockSensitivePaths) {
              if (
                resource.indexOf(".env") !== -1 ||
                resource.indexOf("id_rsa") !== -1 ||
                command.indexOf(".env") !== -1
              ) {
                return {
                  effect: "deny",
                  reason: "Blocked access to secrets / credentials file (.env)",
                };
              }
            }

            // 2. OpenCode Auto-Approve parity (--auto flag / autoApprove: true)
            if (
              permissionState.autoApprove ||
              permissionState.mode === "turbo"
            ) {
              return { effect: "allow", reason: "Auto-approved by policy" };
            }

            // 3. Strict Review Mode
            if (permissionState.mode === "review") {
              return {
                effect: "ask",
                reason: "Review mode requires approval for all operations",
              };
            }

            // 4. Balanced Mode
            if (
              tool === "read" ||
              tool === "read_file" ||
              tool === "grep" ||
              tool === "glob"
            ) {
              return { effect: "allow", reason: "Safe read operation" };
            }
            if (
              (tool === "write" ||
                tool === "edit" ||
                tool === "write_file" ||
                tool === "edit_file") &&
              String(resource).indexOf(permissionState.sandboxRoot) === 0
            ) {
              return { effect: "allow", reason: "Workspace file edit" };
            }
            if (tool === "bash") {
              var cmd = String(command).trim();
              var safePrefixes = [
                "ls",
                "find",
                "grep",
                "rg",
                "git status",
                "git diff",
                "git log",
                "pwd",
                "echo",
                "cat",
                "node -v",
                "npm -v",
              ];
              var isSafe = safePrefixes.some(function (p) {
                return cmd === p || cmd.indexOf(p + " ") === 0;
              });
              if (
                isSafe &&
                cmd.indexOf(";") === -1 &&
                cmd.indexOf("&&") === -1 &&
                cmd.indexOf("|") === -1 &&
                cmd.indexOf(">") === -1
              ) {
                return {
                  effect: "allow",
                  reason: "Safe read-only bash command",
                };
              }
            }

            for (var j = 0; j < permissionState.savedRules.length; j++) {
              var rule = permissionState.savedRules[j];
              if (rule.effect === "allow") {
                if (
                  matchWildcard(tool, rule.action) &&
                  (matchWildcard(resource, rule.resource) ||
                    matchWildcard(command, rule.resource))
                ) {
                  return {
                    effect: "allow",
                    reason: "Matched persistent rule: " + rule.action,
                  };
                }
              }
            }

            return {
              effect: "ask",
              reason:
                "Approval required for command execution or external resource",
            };
          }

          /* ---- resizers ---- */
          var MIN_CHAT = 360;
          function initResizer(handle, side) {
            var varName = side === "sb" ? "--sb-w" : "--ar-w";
            var bounds = side === "sb" ? [220, 520] : [340, 900];
            function otherWidth() {
              var o = $(side === "sb" ? "#artifact" : "#sidebar");
              return o.offsetParent &&
                getComputedStyle(o).position !== "absolute"
                ? o.offsetWidth
                : 0;
            }
            function apply(w) {
              var wb = $("#workbench").clientWidth;
              var max = Math.min(bounds[1], wb - otherWidth() - MIN_CHAT - 2);
              app.style.setProperty(
                varName,
                Math.round(Math.max(bounds[0], Math.min(w, max))) + "px",
              );
              updateTabFade();
            }
            handle.addEventListener("pointerdown", function (e) {
              if (e.button !== 0) return;
              e.preventDefault();
              handle.setPointerCapture(e.pointerId);
              handle.classList.add("is-dragging");
              app.classList.add("is-resizing");
              var rect = $("#workbench").getBoundingClientRect();
              var move = function (ev) {
                apply(
                  side === "sb"
                    ? ev.clientX - rect.left
                    : rect.right - ev.clientX,
                );
              };
              var up = function () {
                handle.classList.remove("is-dragging");
                app.classList.remove("is-resizing");
                handle.removeEventListener("pointermove", move);
                handle.removeEventListener("pointerup", up);
                handle.removeEventListener("pointercancel", up);
                layoutChanged();
              };
              handle.addEventListener("pointermove", move);
              handle.addEventListener("pointerup", up);
              handle.addEventListener("pointercancel", up);
            });
            handle.addEventListener("dblclick", function () {
              app.style.removeProperty(varName);
              layoutChanged();
            });
            handle.addEventListener("keydown", function (e) {
              if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
              e.preventDefault();
              var dir =
                (e.key === "ArrowRight" ? 1 : -1) * (side === "sb" ? 1 : -1);
              apply(
                $(
                  side === "sb" ? "#sidebar" : "#artifact",
                ).getBoundingClientRect().width +
                  dir * 16,
              );
              layoutChanged();
            });
          }
