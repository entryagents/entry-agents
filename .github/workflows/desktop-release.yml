name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v1.0.0-beta.1)"
        required: true
        default: "v1.0.0-beta.1"
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Tauri 2 (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target_name: "macOS"
          - platform: "ubuntu-22.04"
            target_name: "Linux"
          - platform: "windows-latest"
            target_name: "Windows"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI & Desktop Dependencies
        working-directory: apps/desktop
        run: |
          npm install -g @tauri-apps/cli@^2
          npm install --no-save

      - name: Build Tauri 2 Application & Upload Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Entry Agents Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Entry Agents Desktop pre-release built with Tauri 2."
          releaseDraft: false
          prerelease: true
          projectPath: "apps/desktop"
