name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        # Installs the pnpm version pinned in the root package.json `packageManager`
        # field (pnpm@11.5.1). Replaces `corepack enable`, which fails on GitHub
        # runners when the pinned integrity hash cannot be verified.
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        # Blocking gate. `turbo typecheck` runs `tsc --noEmit` in every workspace
        # that defines a typecheck script (apps/web, packages/agent,
        # packages/sandbox, packages/shared) in dependency order — the same set
        # `pnpm -r typecheck` would run for this repo.
        run: pnpm typecheck

      - name: Test
        run: pnpm test:isolated

      - name: DB Check
        run: pnpm --dir apps/web db:check

  workflow-tests:
    name: Workflow unit tests (bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version from the root package.json `packageManager` field (pnpm@11.5.1).
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run each workflow test file in its own process so bun's process-global
      # mock.module registrations cannot leak across files.
      - name: Workflow unit tests
        run: |
          for f in apps/web/app/workflows/*.test.ts; do
            bun test "$f" || exit 1
          done
